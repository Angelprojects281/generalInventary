<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario</title>
    <script>
      try {
        const themes = [
          "claro",
          "oscuro",
          "verde",
          "verde-oscuro",
          "morado",
          "morado-oscuro",
          "naranja",
          "naranja-oscuro",
          "rosa",
          "rosa-oscuro",
        ];
        const stored = localStorage.getItem("inventario-theme");
        const migrated =
          stored === "light" ? "claro" : stored === "dark" ? "oscuro" : stored;
        if (migrated && themes.includes(migrated)) {
          if (migrated !== stored) {
            localStorage.setItem("inventario-theme", migrated);
          }
          document.documentElement.dataset.theme = migrated;
        }
      } catch {
        // The default light theme remains available when storage is disabled.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
